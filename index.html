/* ---------- 9. Simulador com aportes ---------- */
const SIM2 = {ini:10000, ap:1000, tx:12, per:'aa', meses:120, inf:4.5, ir:true};
function sim2Calc(tx){
  const rm = SIM2.per === 'am' ? tx / 100 : Math.pow(1 + tx / 100, 1 / 12) - 1, n = Math.max(1, Math.round(+SIM2.meses || 1)), serie = [];
  let B = +SIM2.ini || 0; serie.push(B);
  for (let k = 1; k <= n; k++){ B = B * (1 + rm) + (+SIM2.ap || 0); serie.push(B); }
  const inv = (+SIM2.ini || 0) + (+SIM2.ap || 0) * n, rend = B - inv, ir = SIM2.ir && rend > 0 ? rend * CALC.irRate(n * 30.4) : 0, liq = B - ir, real = liq / Math.pow(1 + (+SIM2.inf || 0) / 100, n / 12);
  return {B, inv, rend, ir, liq, real, serie, n};

const META_T = ['Reserva de emergência','Imóvel','Veículo','Viagem','Aposentadoria','Independência financeira','Patrimônio no exterior','Educação','Outro'];
function metaRitmo(g){
  if (!g.prazo || !g.alvo) return null;
  const t = today(), ini = g.inicio || t, tot = CALC.days(ini, g.prazo), fr = tot > 0 ? clamp01(CALC.days(ini, t) / tot) : 1, esp = (+g.alvo) * fr, ac = +g.acumulado || 0;
  const meses = Math.max(1, monthsBetween(ym(t), ym(g.prazo))), falta = Math.max(0, (+g.alvo) - ac), rm = Math.pow(1 + settings().cdi / 100 * .85, 1 / 12) - 1;
  const pmtRend = falta > 0 ? (falta - ac * (Math.pow(1 + rm, meses) - 1)) * rm / (Math.pow(1 + rm, meses) - 1) : 0;
  return {esp, atraso: fr > .05 && ac < esp * .9 && ac < +g.alvo, meses, semRend: falta / meses, comRend: Math.max(0, pmtRend)};
}

// Uma aplicação programada é uma transferência "prevista" entre a conta e o investimento (tipo transf, invMov).
// Não conta como receita nem despesa e só mexe no saldo e no investimento quando você confirma.
function contaPrevista(cid, d){
  const c = get(cid); if (!c) return 0; const txs = TX(); let s = FIN.contaSaldo(c, txs);
  for (const t of txs){
    if (t.pago || t.cartao || t.data > d) continue; const v = +t.valor || 0;
    if (t.tipo === 'entrada' && t.conta === cid) s += v;
    else if ((t.tipo === 'saida' || t.tipo === 'pagdiv') && t.conta === cid) s -= v;
    else if (t.tipo === 'transf'){ if (t.conta === cid) s -= v; if (t.contaDest === cid) s += v; }
  }
  for (const card of all('cartao').filter(k => k.conta === cid)) for (const f of FIN.faturasDoCartao(card, txs)) if (f.pend > 0 && f.due <= d) s -= f.pend;
  return CALC.r2(s);
}
// Aplica o efeito de um aporte ou resgate no investimento (custo, quantidade, saldo) e registra no histórico.
function applyInvMov(it, tipo, val, d, q){
  const s = settings(), cur = CALC.evaluate(it, s, d), fx = it.moeda && it.moeda !== 'BRL', fr = cur.fxr || 1;
  if (tipo === 'aporte'){
    const baseM = fx ? cur.bm : cur.bruto; it.aplicado = CALC.r2((+it.aplicado || 0) + val); if (fx) it.aplicadoMoeda = CALC.r2((+it.aplicadoMoeda || 0) + val / fr);
    if (+it.qtd && +it.precoAtual) it.qtd = +it.qtd + (+q || val / (+it.precoAtual * fr)); else if (it.saldoReal || it.idx === 'manual'){ it.saldoReal = CALC.r2(baseM + val / fr); it.dataSaldo = d; }
  } else {
    const fr2 = Math.min(1, val / Math.max(1e-9, cur.bruto));
    if (fr2 >= .995){ it.encerrado = true; it.encData = d; }
    else { it.aplicado = CALC.r2((+it.aplicado || 0) * (1 - fr2)); if (it.aplicadoMoeda) it.aplicadoMoeda = CALC.r2(it.aplicadoMoeda * (1 - fr2)); if (+it.qtd) it.qtd = +it.qtd * (1 - fr2); else if (it.saldoReal || it.idx === 'manual'){ it.saldoReal = CALC.r2((fx ? cur.bm : cur.bruto) * (1 - fr2)); it.dataSaldo = d; } }
  }
  it.hist = [...(it.hist || []), {id:uid('h'), d, tipo, v:CALC.r2(val), obs:''}];
  return it;
}

}

// Quando o dinheiro de cada investimento pode sair: dias para cair na conta, ou a data em que destrava.
function invLiq(i){
  const t = today(), venc = i.venc && i.venc > t ? i.venc : null, lq = i.liquidez || '';
  if (lq === 'Diária' || ['Tesouro Selic','Poupança','Conta em dólar/euro'].includes(i.tipo)) return {dias: i.tipo === 'Poupança' ? 0 : 1, txt: i.tipo === 'Poupança' ? 'resgate na hora' : ['ipca','pre'].includes(i.idx) ? 'resgate em 1 dia (preço oscila)' : 'resgate em 1 dia'};
  if (lq === 'D+30') return {dias:30, txt:'resgate em 30 dias'};
  if (lq === 'D+90') return {dias:90, txt:'resgate em 90 dias'};
  if (i.idx === 'manual' && !['Previdência'].includes(i.tipo)) return {dias:2, txt:'venda em 2 dias (preço oscila)'};
  if (lq === 'No vencimento' || (!lq && venc)) return venc ? {dias:CALC.days(t, venc), ate:venc, txt:`só em ${fmtD(venc)}`} : {dias:1, txt:'vencido: resgate em 1 dia'};
  if (i.tipo === 'Previdência') return {dias:30, txt:'resgate com prazo do plano'};
  return {dias:1, txt:'resgate em 1 dia'};
}
function liqResumo(){
  const s = settings(), t = today(); let ja = 0, curto = 0, travado = 0; const fontes = [];
  for (const i of invAtivos()){ const v = CALC.evaluate(i, s, t).liq, L = invLiq(i); if (L.dias <= 1){ ja += v; fontes.push({i, v}); } else if (L.dias <= 30) curto += v; else travado += v; }
  return {ja, curto, travado, fontes:fontes.sort((a, b) => b.v - a.v)};
}
// Para um buraco no saldo: de qual investimento de liquidez diária dá para tirar.
function coberturaHtml(falta, quando){
  const L = liqResumo(); if (!(falta > 0)) return '';
  const f = L.fontes.find(x => x.v >= falta) || L.fontes[0];
  if (!f) return '<br>Você não tem investimentos com resgate rápido para cobrir.';
  const d = quando && quando > today() ? quando : today();
  return L.ja >= falta ? `<br>Dá para cobrir resgatando de <b>${esc(f.i.nome)}</b> (${esc(invLiq(f.i).txt)}). <button class="btn sm" style="margin-top:6px" data-progres="${f.i.id}|${CALC.r2(falta)}|${d}">Programar resgate de ${brl0(falta)}</button>` : `<br>Seus investimentos de resgate rápido somam ${brl0(L.ja)}, menos do que falta.`;
}
