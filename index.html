<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Caderneta: finanças, investimentos, milhas e viagens. Seus dados ficam só nos seus aparelhos.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Caderneta">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Caderneta Finanças &amp; Milhas</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Layout: app em coluna única no celular (máx. 760px) e painel em duas colunas no computador (máx. 1080px). Barra de abas inferior translúcida; no computador vira uma barra flutuante. Estilo iOS: fundo agrupado, cartões arredondados, fonte do sistema, números grandes. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card-2:#EDEDF2; --seg-on:#FFFFFF; --ink:#0E0E11; --muted:#6C6C72; --line:#E5E5EA; --edge:rgb(0 0 0 / .045);
  --accent:#12924F; --accent-ink:#FFFFFF; --pos:#12924F; --neg:#D9342B; --warn:#B86E00;
  --h-blue:#007AFF; --h-green:#24A148; --h-orange:#F28A00; --h-red:#F0352B; --h-purple:#A94FD6; --h-teal:#1597B5; --h-pink:#F02A57; --h-yellow:#C99700; --h-indigo:#5856D6; --h-gray:#8E8E93;
  --shadow:0 1px 2px rgb(16 24 40 / .04), 0 6px 20px rgb(16 24 40 / .05);
  --bar-bg:rgb(249 249 251 / .82); --scrim:rgb(0 0 0 / .32);
  --f:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-d:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --card-2:#2C2C2E; --seg-on:#48484A; --ink:#F5F5F7; --muted:#8E8E93; --line:#2C2C2F; --edge:rgb(255 255 255 / .06);
  --accent:#30D158; --accent-ink:#00230D; --pos:#30D158; --neg:#FF453A; --warn:#FF9F0A;
  --h-blue:#0A84FF; --h-green:#30D158; --h-orange:#FF9F0A; --h-red:#FF453A; --h-purple:#BF5AF2; --h-teal:#40C8E0; --h-pink:#FF375F; --h-yellow:#FFD60A; --h-indigo:#7D7AFF; --h-gray:#98989F;
  --shadow:none; --bar-bg:rgb(18 18 20 / .78); --scrim:rgb(0 0 0 / .6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card-2:#2C2C2E; --seg-on:#48484A; --ink:#F5F5F7; --muted:#8E8E93; --line:#2C2C2F; --edge:rgb(255 255 255 / .06);
  --accent:#30D158; --accent-ink:#00230D; --pos:#30D158; --neg:#FF453A; --warn:#FF9F0A;
  --h-blue:#0A84FF; --h-green:#30D158; --h-orange:#FF9F0A; --h-red:#FF453A; --h-purple:#BF5AF2; --h-teal:#40C8E0; --h-pink:#FF375F; --h-yellow:#FFD60A; --h-indigo:#7D7AFF; --h-gray:#98989F;
  --shadow:none; --bar-bg:rgb(18 18 20 / .78); --scrim:rgb(0 0 0 / .6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f);font-size:16px;line-height:1.4;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
.ic{width:22px;height:22px;flex:none;display:block}
b,strong{font-weight:600}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn-t{color:var(--warn)}
.muted{color:var(--muted)} .small{font-size:13px}
.amt,.big,.v,.hero-stats b,.flow-row b,.stat b,table.mini td:last-child,.num{font-variant-numeric:tabular-nums}

/* Barra superior */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--bar-bg);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font:600 17px/1 var(--f-d);letter-spacing:-.02em}
.appicon{display:grid;place-items:center;color:#fff;border-radius:9px;width:30px;height:30px;background:linear-gradient(145deg,#2FD27A,#0B8A4C 60%,#076B3A);box-shadow:inset 0 0 0 .5px rgb(255 255 255 / .25)}
.appicon .ic{width:18px;height:18px}
.appicon.lg{width:68px;height:68px;border-radius:18px;margin:0 auto}
.appicon.lg .ic{width:36px;height:36px}
.hdr-actions{display:flex;align-items:center;gap:2px}
.icon-btn{appearance:none;border:0;background:transparent;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{background:var(--card-2)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-right:6px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--h-gray)}
.dot.on{background:var(--pos);box-shadow:0 0 0 3px color-mix(in srgb,var(--pos) 22%,transparent)}

/* Página */
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 132px}
@media (min-width:1000px){.wrap{max-width:1080px}}
main{display:flex;flex-direction:column;gap:14px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:14px}
.pagehead h1{font:700 32px/1.12 var(--f-d);letter-spacing:-.028em;margin:0;text-wrap:balance}
.pagehead p{margin:4px 0 0;color:var(--muted);font-size:15px}
.dash{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:1000px){.dash{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}}
.stack{display:flex;flex-direction:column;gap:14px}

/* Cartões */
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--edge);min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.card-head h3,h3{font:600 17px/1.25 var(--f-d);letter-spacing:-.02em;margin:0}
.label{font-size:13px;color:var(--muted);font-weight:500}
.foot{font-size:12.5px;color:var(--muted);margin:10px 0 0;line-height:1.45}
.hero{background:radial-gradient(120% 120% at 100% 0%,color-mix(in srgb,var(--accent) 16%,transparent) 0%,transparent 55%),var(--card)}
.big{font:700 40px/1.08 var(--f-d);letter-spacing:-.035em;margin:6px 0 2px;overflow-wrap:anywhere}
.cents{font-size:.55em;font-weight:600;color:var(--muted);letter-spacing:-.01em}
.hero-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.hero-stats div{display:flex;flex-direction:column;gap:3px;min-width:0}
.hero-stats .label{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-stats b{font-size:16px;letter-spacing:-.02em;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{display:flex;flex-direction:column;min-width:0}
.kpi-label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:500;line-height:1.2}
.kpi-label .tile{width:28px;height:28px;border-radius:8px}
.kpi-label .tile .ic{width:16px;height:16px}
.kpi .v{font:700 23px/1.15 var(--f-d);letter-spacing:-.03em;margin-top:14px;overflow-wrap:anywhere}
.kpi .v.txt{font-size:19px;letter-spacing:-.02em}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.35}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.stat b{font:700 17px/1.2 var(--f-d);letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{font-size:11.5px;color:var(--muted)}

/* Ícones em quadrado colorido */
.tile{--hue:var(--h-gray);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--hue);background:color-mix(in srgb,var(--hue) 15%,transparent)}
.tile .ic{width:19px;height:19px}
.tile.mono{font:700 13px/1 var(--f-d);letter-spacing:-.01em}

/* Listas */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;min-width:0;position:relative}
.item + .item::before{content:"";position:absolute;top:0;left:48px;right:0;border-top:1px solid var(--line)}
.item .main{flex:1;min-width:0}
.item .t{font-size:15.5px;font-weight:500;overflow-wrap:anywhere;line-height:1.3}
.item .m{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.35}
.item .amt{font-size:15.5px;font-weight:600;white-space:nowrap;text-align:right;letter-spacing:-.015em}
.item .amt .m{font-weight:500}
.item .chev{color:var(--muted);width:16px;height:16px}
.dayhead{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:14px 0 2px}
.dayhead:first-child{padding-top:2px}
.flow{display:flex;flex-direction:column}
.flow-row{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:15px}
.flow-row + .flow-row{border-top:1px solid var(--line)}
.flow-row>span:not(.tile){flex:1;min-width:0}
.flow-row b{white-space:nowrap;font-size:15.5px}
.flow-row.total{padding-top:12px}
.flow-row.total span{font-weight:600}
.flow-row.total b{font:700 19px/1.2 var(--f-d);letter-spacing:-.025em}
[role=button]{cursor:pointer}
.card[role=button]:hover,.item[role=button]:hover .t{opacity:.86}

/* Controles */
.btn{appearance:none;border:0;background:var(--card-2);color:var(--ink);border-radius:12px;height:42px;padding:0 16px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn .ic{width:18px;height:18px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sm{height:32px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.full{width:100%;margin-top:6px}
.btn.danger{color:var(--neg)}
.btn:disabled{opacity:.5;cursor:default}
.link{appearance:none;border:0;background:transparent;color:var(--accent);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:2px;padding:4px 0}
.link .ic{width:16px;height:16px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.days{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:1000px){.days{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}
.hora{width:44px;flex:none;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.tl .item + .item::before{left:104px}
.tl-check{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
details summary{list-style:none} details summary::-webkit-details-marker{display:none}
@media (max-width:520px){.toolrow .btn span{display:none}.toolrow .btn{padding:0 12px}}
.mini-sel{margin-top:6px;max-width:100%;border:0;background:var(--card-2);color:var(--ink);border-radius:8px;padding:5px 8px;font-size:13px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.seg{display:flex;background:var(--card-2);border-radius:11px;padding:2px;gap:2px;overflow-x:auto;scrollbar-width:none;flex:none;max-width:100%}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:transparent;border-radius:9px;padding:7px 14px;font-weight:600;font-size:13.5px;white-space:nowrap;color:var(--muted)}
.seg button.on{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.seg.sm button{padding:5px 10px;font-size:12.5px}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav b{font:600 17px/1 var(--f-d);letter-spacing:-.02em}
.search{min-width:0;display:flex;align-items:center;gap:8px;background:var(--card-2);border-radius:12px;padding:0 12px;color:var(--muted)}
.search .ic{width:18px;height:18px}
.search input{flex:1;min-width:0;border:0;background:transparent;height:40px;font-size:16px;color:var(--ink);outline:none}
.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--card-2);color:var(--muted);white-space:nowrap;vertical-align:1px;margin-left:4px;letter-spacing:0}
.chip.good{color:var(--pos);background:color-mix(in srgb,var(--pos) 14%,transparent)}
.chip.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.chip.bad{color:var(--neg);background:color-mix(in srgb,var(--neg) 14%,transparent)}
.chip.ex{color:var(--h-purple);background:color-mix(in srgb,var(--h-purple) 14%,transparent)}
.bar{height:6px;background:var(--card-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar>i.warn{background:var(--warn)} .bar>i.bad{background:var(--neg)}
.stacked{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;margin:6px 0 10px}
.stacked i{display:block;height:100%}
.legend{display:flex;align-items:center;gap:8px;font-size:13px}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}
.btn:focus-visible,.tab:focus-visible,.icon-btn:focus-visible,.link:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[role=button]:focus-visible,.seg button:focus-visible,.step:focus-visible{outline:2px solid var(--h-blue);outline-offset:2px}

/* Avisos */
.banner{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;font-size:14px;background:color-mix(in srgb,var(--h-purple) 12%,var(--card));border:1px solid color-mix(in srgb,var(--h-purple) 22%,transparent)}
.banner>.ic{color:var(--h-purple);width:20px;height:20px}
.banner span{flex:1;min-width:0}
.banner.warn{background:color-mix(in srgb,var(--warn) 12%,var(--card));border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.banner.warn>.ic{color:var(--warn)}
.callout{border-radius:14px;padding:12px 14px;font-size:14px;background:var(--card-2);line-height:1.45}
.callout b{color:var(--ink)}
.note{font-size:12.5px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:26px 12px;font-size:14.5px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .tile{width:48px;height:48px;border-radius:14px}
.empty .tile .ic{width:24px;height:24px}

/* Boas-vindas */
.welcome{text-align:center;padding:24px 16px 12px}
.welcome h3{font-size:22px;margin-top:14px}
.welcome>p{color:var(--muted);margin:6px auto 16px;max-width:36ch;font-size:15px}
.steps{display:flex;flex-direction:column;text-align:left}
.step{appearance:none;border:0;background:transparent;display:flex;align-items:center;gap:12px;padding:11px 0;width:100%;text-align:left;position:relative}
.step + .step::before{content:"";position:absolute;top:0;left:48px;right:0;border-top:1px solid var(--line)}
.step span{flex:1;display:flex;flex-direction:column;gap:2px}
.step small{color:var(--muted);font-size:13px}
.step>.ic{color:var(--muted);width:16px;height:16px}

/* Cartão de crédito ilustrado (cores fixas sobre fundo escuro, legível nos dois temas) */
.cc-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:1000px){.cc-grid{grid-template-columns:minmax(0,380px) minmax(0,1fr);align-items:start}}
.ccard{position:relative;aspect-ratio:1.586;width:100%;max-width:400px;border-radius:20px;padding:18px 20px;color:#fff;background:linear-gradient(140deg,var(--c1),var(--c2));display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;box-shadow:0 10px 30px rgb(0 0 0 / .18)}
.ccard::after{content:"";position:absolute;inset:-40% -20% auto auto;width:70%;aspect-ratio:1;border-radius:50%;background:rgb(255 255 255 / .07)}
.cc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative;z-index:1}
.cc-name{font:600 17px/1.2 var(--f-d);letter-spacing:-.01em}
.cc-sub{font-size:12px;opacity:.75;margin-top:2px}
.cc-chipimg{width:34px;height:26px;border-radius:6px;background:linear-gradient(135deg,#F3D58B,#B9902F);flex:none}
.cc-mid{position:relative;z-index:1}
.cc-label{font-size:12px;opacity:.75}
.cc-val{font:700 26px/1.1 var(--f-d);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cc-foot{position:relative;z-index:1;display:flex;justify-content:space-between;gap:8px;font-size:12px;opacity:.85}
.cc-bar{height:4px;border-radius:99px;background:rgb(255 255 255 / .22);overflow:hidden;margin-top:8px}
.cc-bar i{display:block;height:100%;background:#fff;border-radius:99px}

/* Gráfico */
.chart{width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}

/* Barra de abas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar-bg);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{display:flex;max-width:760px;margin:0 auto}
.tab{flex:1;border:0;background:transparent;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:0}
.tab .ic{width:25px;height:25px}
.tab.on{color:var(--accent)}
@media (min-width:700px){
  nav.tabs{left:50%;right:auto;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 32px));border:1px solid var(--line);border-radius:22px;padding:4px;box-shadow:0 10px 30px rgb(0 0 0 / .12)}
  .tab{flex-direction:row;justify-content:center;gap:7px;font-size:13px;padding:10px 6px;border-radius:16px}
  .tab .ic{width:20px;height:20px}
  .tab.on{background:color-mix(in srgb,var(--accent) 13%,transparent)}
}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:21;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 40%,transparent)}
.fab .ic{width:26px;height:26px}
@media (min-width:700px){.fab{bottom:calc(24px + env(safe-area-inset-bottom,0px));right:calc(max(24px,(100vw - 1080px)/2) + env(safe-area-inset-right,0px))}}

/* Janela de formulário */
.sheet-bg{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.grabber{width:38px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 10px}
.sheet-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}

<script>
/* ===================== CÁLCULOS (puros, testáveis) ===================== */
const CALC = (() => {
  const DAY = 86400000;
  const toD = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, (m||1)-1, d||1); };
  const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const days = (a,b) => Math.round((toD(b) - toD(a)) / DAY);
  const r2 = v => Math.round((Number(v)||0)*100)/100;
  const IOF = [96,93,90,86,83,80,76,73,70,66,63,60,56,53,50,46,43,40,36,33,30,26,23,20,16,13,10,6,3,0];
  const irRate = d => d <= 180 ? .225 : d <= 360 ? .20 : d <= 720 ? .175 : .15;
  const iofRate = d => d >= 30 || d < 1 ? 0 : IOF[d-1] / 100;
  function factor(inv, dc, s){
    if (dc <= 0) return 1;
    const t = (+inv.taxa || 0) / 100, cdi = (+s.cdi || 0) / 100, ipca = (+s.ipca || 0) / 100;
    const du = dc * 252 / 365;
    switch (inv.idx){
      case 'cdi': { const d = Math.pow(1+cdi, 1/252) - 1; return Math.pow(1 + d * t, du); }
      case 'selic': return Math.pow(1+cdi, du/252) * Math.pow(1+t, du/252);
      case 'pre': return Math.pow(1+t, dc/365);
      case 'ipca': return Math.pow((1+ipca)*(1+t), dc/365);
      case 'poup': { const m = cdi > .085 ? .005 : Math.pow(1 + .7*cdi, 1/12) - 1; return Math.pow(1+m, dc/30.42); }
      default: return 1;
    }
  }
  // Estimativa a partir do último saldo real informado (se houver), senão do valor aplicado.
  function evaluate(inv, s, at){
    const P = +inv.aplicado || 0;
    const real = +inv.saldoReal || +inv.atual || 0;
    const dias = Math.max(0, days(inv.inicio, at));
    const q = +inv.qtd || 0, pa = +inv.precoAtual || 0, fee = (+inv.taxaAdm || 0) / 100;
    const feeF = fee > 0 && inv.idx !== 'manual' && !(q && pa) ? Math.pow(1 - fee, dias / 365) : 1;
    // Investimento no exterior: calcula na moeda e converte pela cotação dos Ajustes. IR de 15% sobre o ganho em reais (Lei 14.754/2023).
    if (inv.moeda && inv.moeda !== 'BRL'){
      const fxr = +((s.cot || {})[inv.moeda]) || 0, Pm = +inv.aplicadoMoeda || (fxr ? P / fxr : 0);
      let bm;
      if (q && pa) bm = q * pa;
      else if (inv.idx === 'manual') bm = real || Pm;
      else if (real && inv.dataSaldo && days(inv.dataSaldo, at) >= 0) bm = real * factor(inv, days(inv.dataSaldo, at), s);
      else bm = Pm * factor(inv, dias, s);
      bm *= feeF; const bruto = bm * fxr, rend = bruto - P, ir = rend > 0 ? rend * .15 : 0;
      return { bruto, rend, iof:0, ir, liq: bruto - ir, dias, bm, fxr };
    }
    let bruto;
    if (q && pa) bruto = q * pa;
    else if (inv.idx === 'manual') bruto = real || P;
    else if (real && inv.dataSaldo && days(inv.dataSaldo, at) >= 0) bruto = real * factor(inv, days(inv.dataSaldo, at), s);
    else bruto = P * factor(inv, dias, s);
    bruto *= feeF;
    const rend = bruto - P;
    if (inv.idx === 'manual' || rend <= 0) return { bruto, rend, iof:0, ir:0, liq:bruto, dias };
    const iof = rend * iofRate(dias);
    const ir = inv.isento ? 0 : (rend - iof) * irRate(dias);
    return { bruto, rend, iof, ir, liq: bruto - iof - ir, dias };
  }
  const grossUp = (pct, d) => pct / (1 - irRate(d));
  function lots(movs){
    const k = m => m.venc || '9999-12-31';
    const cred = movs.filter(m => m.qtd > 0).map(m => ({...m, resta:+m.qtd})).sort((a,b) => k(a) < k(b) ? -1 : k(a) > k(b) ? 1 : (a.data < b.data ? -1 : 1));
    let deb = movs.filter(m => m.qtd < 0).reduce((s,m) => s - m.qtd, 0);
    for (const c of cred){ const u = Math.min(c.resta, deb); c.resta -= u; deb -= u; if (deb <= 0) break; }
    return cred.filter(c => c.resta > 0);
  }
  // Fatura do cartão: em que mês VENCE a fatura que recebe uma compra feita em "data".
  function lastDay(y, m){ return new Date(y, m+1, 0).getDate(); }
  function mkDate(y, m, d){ const dt = new Date(y, m, 1); return new Date(dt.getFullYear(), dt.getMonth(), Math.min(d, lastDay(dt.getFullYear(), dt.getMonth()))); }
  function faturaOf(card, data){
    const d = toD(data), fecha = +card.fecha, vence = +card.vence;
    const off = d.getDate() < fecha ? 0 : 1;            // comprou no dia do fechamento ou depois: vai para a próxima
    const close = mkDate(d.getFullYear(), d.getMonth()+off, fecha);
    const due = mkDate(close.getFullYear(), close.getMonth() + (vence > fecha ? 0 : 1), vence);
    return { key: iso(due).slice(0,7), close: iso(close), due: iso(due) };
  }
  function faturaDates(card, key){
    const [y,m] = key.split('-').map(Number), fecha = +card.fecha, vence = +card.vence;
    const due = mkDate(y, m-1, vence);
    const close = mkDate(y, m-1 - (vence > fecha ? 0 : 1), fecha);
    return { close: iso(close), due: iso(due) };
  }
  // Divide valor em n parcelas com centavos exatos (diferença na última).
  function split(total, n){ const c = Math.round(total*100), base = Math.floor(c/n), out = []; for (let i=0;i<n;i++) out.push((i===n-1 ? c - base*(n-1) : base)/100); return out; }
  return { days, irRate, iofRate, factor, evaluate, grossUp, lots, toD, iso, faturaOf, faturaDates, split, r2 };
})();

/* ===================== FINANÇAS (regras centralizadas) ===================== */
const FIN = {
  // tipos de tx: entrada | saida | transf | pagfatura | pagdiv
  contaSaldo(conta, txs){
    let s = +conta.saldoIni || 0;
    for (const t of txs){
      if (!t.pago) continue;
      if (conta.dataIni && t.data < conta.dataIni) continue;
      const v = +t.valor || 0;
      if (t.conta === conta.id){
        if (t.tipo === 'entrada') s += v;
        else if (t.tipo === 'saida' || t.tipo === 'transf' || t.tipo === 'pagfatura' || t.tipo === 'pagdiv') s -= v;
      }
      if (t.tipo === 'transf' && t.contaDest === conta.id) s += v;
    }
    return CALC.r2(s);
  },
  // Receitas/despesas por competência (data da compra/lançamento). Transferências e pagamentos de fatura/dívida não entram.
  monthTotals(txs, m){
    let e = 0, s = 0, prev = 0;
    for (const t of txs){
      if (String(t.data).slice(0,7) !== m) continue;
      const v = +t.valor || 0;
      if (t.tipo === 'entrada'){ if (t.cartao) s -= v; else e += v; }
      else if (t.tipo === 'saida') s += v;
      else continue;
      if (!t.pago && !t.cartao) prev++;
    }
    return { e:CALC.r2(e), s:CALC.r2(s), saldo:CALC.r2(e-s), prev };
  },
  fatura(card, key, txs){
    let total = 0, pago = 0;
    for (const t of txs){
      if (t.cartao !== card.id || t.fatura !== key) continue;
      const v = +t.valor || 0;
      if (t.tipo === 'saida') total += v;
      else if (t.tipo === 'entrada') total -= v;      // estorno
      else if (t.tipo === 'pagfatura') pago += v;
    }
    const d = CALC.faturaDates(card, key);
    return { key, total:CALC.r2(total), pago:CALC.r2(pago), pend:CALC.r2(Math.max(0,total-pago)), ...d };
  },
  faturaStatus(f, hoje){
    if (f.total <= 0 && f.pago <= 0) return 'vazia';
    if (f.pend <= 0.004) return 'paga';
    if (hoje > f.due) return 'vencida';
    if (f.pago > 0) return 'parcial';
    if (hoje >= f.close) return 'fechada';
    return 'aberta';
  },
  faturasDoCartao(card, txs){
    const keys = new Set(txs.filter(t => t.cartao === card.id && t.fatura).map(t => t.fatura));
    return [...keys].sort().map(k => FIN.fatura(card, k, txs));
  },
  // Meses futuros de um fixo no cartão (assinaturas) não ocupam o limite antes da cobrança; parcelas ocupam.
  limiteDisp(card, txs){ const t = CALC.iso(new Date()), ts = txs.filter(x => !(x.rec && x.data > t)); return CALC.r2((+card.limite||0) - FIN.faturasDoCartao(card, ts).reduce((s,f)=>s+f.pend,0)); },
  // Compromissos até "ate" (inclusive): contas não pagas + faturas pendentes que vencem até lá (vencidas inclusas).
  compromissos(txs, cards, hoje, ate){
    const receber = [], pagar = [];
    for (const t of txs){
      if (t.pago || t.cartao || !(t.tipo === 'entrada' || t.tipo === 'saida' || (t.tipo === 'transf' && t.invMov))) continue;
      if (t.data > ate) continue;
      (t.tipo === 'entrada' || t.invMov === 'resgate' ? receber : pagar).push({tipo:'tx', t, data:t.data, valor:+t.valor});
    }
    for (const c of cards){
      for (const f of FIN.faturasDoCartao(c, txs)){
        if (f.pend > 0 && f.due <= ate) pagar.push({tipo:'fatura', card:c, f, data:f.due, valor:f.pend});
      }
    }
    const sum = a => CALC.r2(a.reduce((s,x)=>s+x.valor,0));
    return { receber, pagar, totReceber:sum(receber), totPagar:sum(pagar) };
  }
};

/* ===================== CRIPTOGRAFIA ===================== */
const CRYPTO = (() => {
  const te = new TextEncoder(), td = new TextDecoder();
  const b64 = buf => { const a = new Uint8Array(buf); let s = ''; for (let i=0;i<a.length;i+=0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i+0x8000)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function derive(user, pass, saltB64, iter){
    const base = await crypto.subtle.importKey('raw', te.encode(user.trim().toLowerCase() + '\n' + pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', salt:unb64(saltB64), iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
  }
  async function enc(key, obj){ const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, te.encode(JSON.stringify(obj))); return {iv:b64(iv), ct:b64(ct)}; }
  async function dec(key, rec){ const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(rec.iv)}, key, unb64(rec.ct)); return JSON.parse(td.decode(pt)); }
  const newSalt = () => b64(crypto.getRandomValues(new Uint8Array(16)));
  return { derive, enc, dec, newSalt, b64, unb64, ITER: 250000 };
})();

/* ===================== UTIL ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => (Number(v)||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const brl0 = v => (Number(v)||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL', maximumFractionDigits:0});
const int = v => Math.round(Number(v)||0).toLocaleString('pt-BR');
const pct = v => (Number(v)||0).toLocaleString('pt-BR', {maximumFractionDigits:2}) + '%';
const today = () => CALC.iso(new Date());
const ym = d => String(d).slice(0,7);
const addMonths = (s, n) => { const d = CALC.toD(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(day,last)); return CALC.iso(d); };
const addDays = (s, n) => { const d = CALC.toD(s); d.setDate(d.getDate()+n); return CALC.iso(d); };
const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const fmtD = s => { if (!s) return '—'; const d = CALC.toD(s); return d.getDate() + ' ' + MES[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''); };
const monthName = m => { const [y,mm] = m.split('-').map(Number); const t = new Date(y, mm-1, 1).toLocaleDateString('pt-BR', {month:'long', year:'numeric'}); return t.charAt(0).toUpperCase() + t.slice(1); };
const monthShort = m => { const [y,mm] = String(m).split('-').map(Number); return MES[mm-1] + '/' + String(y).slice(2); };
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(e){} };
function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2400); }

const DEF_OUT = ['Moradia','Alimentação','Mercado','Restaurantes','Transporte','Saúde','Educação','Lazer','Assinaturas','Compras pessoais','Contas da casa','Viagem','Pets','Presentes','Impostos','Despesas financeiras','Outras despesas'];

/* ===================== ARMAZENAMENTO CIFRADO ===================== */
// raw: o que está gravado (cifrado). items: dados abertos, só em memória enquanto desbloqueado.
// Modos: 'cloud' (conta Claude, sincroniza), 'idb' (banco do próprio navegador), 'local' (reserva: localStorage).
// Cada registro guarda "upd" (quando mudou). Itens apagados viram marcas "del" para a sincronização por arquivo não ressuscitá-los.
const IN_CLAUDE = !!window.claude;
const S = { raw:new Map(), items:new Map(), dels:new Map(), cache:new Map(), mode:'idb', col:null, key:null, loaded:false, bad:0 };
const RKEY = 'caderneta.v2.raw';
const LDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('sem indexedDB'));
    const r = indexedDB.open('caderneta', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('raw', {keyPath:'id'});
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('raw', mode), req = fn(t.objectStore('raw')); t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); };
  return { all: () => run('readonly', st => st.getAll()), put: rec => run('readwrite', st => st.put(rec)), putMany: recs => run('readwrite', st => { recs.forEach(r => st.put(r)); return null; }) };
})();
function saveLocal(){ if (S.mode === 'local') lsSet(RKEY, JSON.stringify([...S.raw.values()])); }
function readLegacy(){
  const out = [];
  try { const raw = lsGet(RKEY); if (raw) JSON.parse(raw).forEach(r => out.push(r)); } catch(e){}
  try { const v1 = lsGet('caderneta.v1'); if (v1) JSON.parse(v1).forEach(i => { if (!out.some(r => r.id === i.id)) out.push(i); }); } catch(e){}
  return out;
}
const lockDoc = () => S.raw.get('lock');
async function writeRaw(rec){
  S.raw.set(rec.id, rec);
  if (S.mode === 'cloud'){ try { await S.col.doc(rec.id).set(rec); } catch(e){ toast(e?.code === 'quota_exceeded' ? 'Limite de armazenamento atingido.' : 'Não foi possível salvar na nuvem. Tente de novo.'); } }
  else if (S.mode === 'idb'){ try { await LDB.put(rec); } catch(e){ toast('Não foi possível salvar neste aparelho. Libere espaço e tente de novo.'); } }
  else saveLocal();
}
async function sealItem(item){ const c = await CRYPTO.enc(S.key, item); S.cache.set(c.ct, item); return {id:item.id, kind:'enc', iv:c.iv, ct:c.ct, u:+item.upd || 0}; }
async function storeItems(list, opt = {}){
  if (!opt.nolog && typeof logEntries === 'function'){ const lg = logEntries(list); if (lg.length) list = [...list, {id:'auditlog', kind:'auditlog', itens:[...lg, ...(S.items.get('auditlog')?.itens || [])].slice(0, 300), upd:Date.now()}]; }
  for (const it of list){ if (it.kind === 'del'){ S.items.delete(it.id); S.dels.set(it.id, it); } else { S.dels.delete(it.id); S.items.set(it.id, it); } }
  render();
  for (const it of list) await writeRaw(await sealItem(it));
  if (FB.sess) fbMark(list.map(i => i.id));
}
async function put(item){ if (!S.key) return; await storeItems([{...item, upd:Date.now()}]); }
async function putMany(list){ if (!S.key || !list.length) return; const n = Date.now(); await storeItems(list.map(i => ({...i, upd:n}))); }
async function del(id){ if (!S.key) return; await storeItems([{id, kind:'del', upd:Date.now()}]); }
async function delMany(ids){ if (!S.key || !ids.length) return; const n = Date.now(); await storeItems(ids.map(id => ({id, kind:'del', upd:n}))); }
async function openAll(){
  if (!S.key) return;
  const next = new Map(), dels = new Map(); let bad = 0;
  for (const r of S.raw.values()){
    if (r.kind === 'lock' || r.kind === 'sess' || r.kind === 'off') continue;
    let it = r;
    if (r.kind === 'enc'){ it = S.cache.get(r.ct); if (!it){ try { it = await CRYPTO.dec(S.key, r); S.cache.set(r.ct, it); } catch(e){ bad++; continue; } } }
    if (it.kind === 'del') dels.set(it.id, it); else next.set(it.id, it);
  }
  S.items = next; S.dels = dels; S.bad = bad;
}
const all = kind => [...S.items.values()].filter(i => i.kind === kind);
const get = id => S.items.get(id);

async function initStore(){
  if (!IN_CLAUDE) await fbLoadCfg();
  if (IN_CLAUDE){
    let tries = 0; while (!window.claude?.use && tries++ < 20) await new Promise(r => setTimeout(r, 100));
    if (window.claude?.use){
      try {
        const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        const id = user ? await user.id() : null;
        if (db && id){
          S.col = db.collection('data/users/' + id);
          await new Promise(resolve => {
            let first = true;
            S.col.onSnapshot(async snap => {
              S.mode = 'cloud';
              S.raw = new Map(snap.docs.map(d => [d.id, d.data()]));
              if (S.key) await openAll();
              S.loaded = true;
              if (first){ first = false; resolve(); }
              render();
            }, () => { if (first){ first = false; S.mode = 'idb'; resolve(); } });
            setTimeout(() => { if (first){ first = false; resolve(); } }, 9000);
          });
        }
      } catch(e){}
    }
  }
  if (S.mode !== 'cloud'){
    S.raw = new Map();
    try {
      const recs = await LDB.all(); S.mode = 'idb'; (recs || []).forEach(r => S.raw.set(r.id, r));
      const legacy = readLegacy().filter(r => !S.raw.has(r.id));
      if (legacy.length){ legacy.forEach(r => S.raw.set(r.id, r)); await LDB.putMany(legacy); lsSet(RKEY, null); lsSet('caderneta.v1', null); }
    } catch(e){ S.mode = 'local'; readLegacy().forEach(r => S.raw.set(r.id, r)); }
    try { navigator.storage?.persist?.(); } catch(e){}
  }
  S.loaded = true; render();
}

/* ===================== BLOQUEIO ===================== */
const LOCKUI = { fails: +(lsGet('caderneta.fails')||0), until: +(lsGet('caderneta.until')||0), lastActive: Date.now(), hiddenAt: 0 };
const IDLE_MS = 5*60*1000, AWAY_MS = 60*1000;
function lockNow(){ LOCKUI.usePass = false; REC_DAY = ''; SNAP_DAY = ''; S.key = null; S.dkRaw = null; if (typeof FB !== 'undefined'){ FB.sess = null; FB.idTok = ''; } S.items = new Map(); S.dels = new Map(); S.cache = new Map(); closeSheet(); render(); }
// A chave dos dados (DK) é aleatória; a senha só a protege. Assim dá para trocar ou redefinir a senha sem recriptografar tudo.
async function createLock(user, pass, dkRaw){
  if (!S.key){ S.key = await importDK(crypto.getRandomValues(new Uint8Array(32))); await openAll(); S.key = null; }
  dkRaw = dkRaw || S.dkRaw || crypto.getRandomValues(new Uint8Array(32));
  const salt = CRYPTO.newSalt(), K = await CRYPTO.derive(user, pass, salt, CRYPTO.ITER);
  const check = await CRYPTO.enc(K, {ok:true, user:user.trim()}), wrap = await CRYPTO.enc(K, {dk:CRYPTO.b64(dkRaw)});
  const rekey = !(S.dkRaw && sameBytes(S.dkRaw, dkRaw));
  S.key = await importDK(dkRaw); S.dkRaw = dkRaw;
  if (rekey){ S.cache = new Map(); for (const it of [...S.items.values(), ...S.dels.values()]) await writeRaw(await sealItem(it)); }
  await writeRaw({id:'lock', kind:'lock', v:2, salt, iter:CRYPTO.ITER, check, wrap});
  lsSet('caderneta.user', user.trim());
}
async function unlock(user, pass){
  const L = lockDoc(), K = await CRYPTO.derive(user, pass, L.salt, L.iter);
  try { const c = await CRYPTO.dec(K, L.check); if (!c.ok || String(c.user).toLowerCase() !== user.trim().toLowerCase()) return false; }
  catch(e){ return false; }
  if (L.wrap){ const w = await CRYPTO.dec(K, L.wrap); S.dkRaw = CRYPTO.unb64(w.dk); S.key = await importDK(S.dkRaw); await openAll(); }
  else { S.key = K; S.dkRaw = null; await openAll(); await createLock(user, pass); }
  const legacy = [...S.raw.values()].filter(r => !['enc','lock','sess','off'].includes(r.kind));
  for (const r of legacy) await writeRaw(await sealItem(r));
  return true;
}

  const top = (t, s) => `<div style="text-align:center"><div class="appicon lg">${ic('wallet')}</div><h1>${t}</h1><p class="sub">${s}</p></div>`;

    </form>${!IN_CLAUDE && FB.cfg ? `<button class="btn" type="button" data-act="fb-join">${ic('arrows')}Já uso em outro aparelho: entrar com e-mail</button>` : ''}</div>`;
  return `<div class="lockwrap">${top('Caderneta bloqueada', 'Entre com seu usuário e senha.')}
    <form id="lockForm" class="card" autocomplete="on" style="padding:18px">
      <label class="f">Usuário<input class="inp" id="lk-user" autocomplete="username" autocapitalize="none" value="${esc(lsGet('caderneta.user')||'')}" required></label>
      <label class="f">Senha<input class="inp" id="lk-pass" type="password" autocomplete="current-password" required></label>
      <div class="err" id="lk-err">${wait ? `Muitas tentativas. Aguarde ${wait} s.` : ''}</div>
      <button class="btn pri" type="submit" ${wait?'disabled':''}>${ic('lock')}Entrar</button>
    </form>${!IN_CLAUDE && FB.cfg ? `<button class="link" type="button" data-act="fb-forgot" style="align-self:center">Esqueci a senha</button>` : ''}</div>`;
}
async function onLockSubmit(e){
  e.preventDefault();
  const err = $('#lk-err'), btn = e.target.querySelector('button[type=submit]');
  const user = $('#lk-user').value, pass = $('#lk-pass').value;
  if (!window.crypto?.subtle) return err.textContent = 'Este navegador não permite criptografia nesta página. Abra pelo link https da Caderneta.';
  if (!lockDoc()){
    if (user.trim().length < 2) return err.textContent = 'Usuário precisa de pelo menos 2 caracteres.';
    if (pass.length < 6) return err.textContent = 'A senha precisa de pelo menos 6 caracteres.';
    if (pass !== $('#lk-pass2').value) return err.textContent = 'As senhas não conferem.';
    btn.disabled = true; btn.textContent = 'Protegendo seus dados…';
    try { await createLock(user, pass); render(); toast('Acesso criado'); } catch(x){ err.textContent = 'Não foi possível criar o acesso neste navegador.'; btn.disabled = false; btn.textContent = 'Criar acesso e entrar'; }
    return;
  }
  if (Date.now() < LOCKUI.until) return;
  btn.disabled = true; btn.textContent = 'Verificando…';
  const ok = await unlock(user, pass);
  if (ok){ LOCKUI.fails = 0; lsSet('caderneta.fails', '0'); lsSet('caderneta.user', user.trim()); LOCKUI.lastActive = Date.now(); render(); fbAfterUnlock(); return; }
  btn.disabled = false; btn.textContent = 'Entrar'; $('#lk-pass').value = '';
  LOCKUI.fails++; lsSet('caderneta.fails', String(LOCKUI.fails));
  if (LOCKUI.fails >= 5){ LOCKUI.until = Date.now() + 30000 * (LOCKUI.fails - 4); lsSet('caderneta.until', String(LOCKUI.until)); }
  render();
  const e2 = $('#lk-err'); if (e2 && Date.now() >= LOCKUI.until) e2.textContent = 'Usuário ou senha incorretos.';
  if (Date.now() < LOCKUI.until) setTimeout(render, LOCKUI.until - Date.now() + 50);
}
['pointerdown','keydown','touchstart'].forEach(ev => document.addEventListener(ev, () => LOCKUI.lastActive = Date.now(), {passive:true}));
setInterval(() => { if (S.key && Date.now() - LOCKUI.lastActive > IDLE_MS) lockNow(); }, 20000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) LOCKUI.hiddenAt = Date.now();
  else if (S.key && LOCKUI.hiddenAt && Date.now() - LOCKUI.hiddenAt > AWAY_MS) lockNow();
});

function progStats(pid, ate, skipId){
  const movs = all('pmov').filter(m => m.prog === pid && m.id !== skipId && (!ate || m.data <= ate) && !isPend(m)).sort((a,b) => a.data < b.data ? -1 : a.data > b.data ? 1 : (b.qtd - a.qtd));
  let q = 0, c = 0, saldo = 0, investido = 0;
  for (const m of movs){
    const n = +m.qtd || 0; saldo += n;
    if (n > 0){ q += n; c += +m.custo || 0; investido += +m.custo || 0; }
    else { const take = Math.min(-n, q), avg = q > 0 ? c/q : 0; c -= avg*take; q -= take; }
  }
  return { saldo, custo: Math.max(0, c), cpm: q > 0 ? c/q*1000 : 0, investido };
}

async function fbPull(){

    sq.startAt = cursor ? {values:[{integerValue:String(cursor.u)}, {referenceValue:cursor.n}], before:false} : {values:[{integerValue:String(Math.max(0, maxU - 600000))}], before:true};

      const id = d.name.split('/').pop(), u = +(d.fields?.u?.integerValue || 0), loc = S.raw.get(id);

function ptsChart(){
  const months = []; for (let i = 5; i >= 0; i--) months.push(ym(addMonths(today().slice(0,8)+'01', -i)));
  const movs = all('pmov').filter(m => !isPend(m)), data = months.map(m => { const ms = movs.filter(x => ym(x.cred && x.cred > x.data ? x.cred : x.data) === m); return {e:ms.filter(x=>x.qtd>0).reduce((s,x)=>s+(+x.qtd),0), s:ms.filter(x=>x.qtd<0).reduce((s,x)=>s-(+x.qtd),0)}; });
  const max = Math.max(1, ...data.map(x => Math.max(x.e, x.s)));
  if (max <= 1) return '<p class="small muted" style="margin:6px 0">Sem movimentos nos últimos 6 meses.</p>';
  const raw = max/3, p = Math.pow(10, Math.floor(Math.log10(raw))), step = [1,2,2.5,5,10].map(k=>k*p).find(k=>k>=raw), top = step*3;
  const W = 340, H = 160, L = 34, B = 22, T = 6, gw = (W-L)/6, bw = Math.min(11, gw*.26), y = v => T + (H-T-B)*(1 - v/top);
  const short = v => v >= 1000 ? (v/1000).toLocaleString('pt-BR', {maximumFractionDigits:1}) + ' mil' : int(v);
  let g = '';
  for (let k = 0; k <= 3; k++){ const yy = y(step*k); g += `<line x1="${L}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)" ${k?'stroke-dasharray="3 4"':''}/><text x="0" y="${yy+4}" font-size="9.5" fill="var(--muted)">${k ? short(step*k) : '0'}</text>`; }
  data.forEach((x, i) => { const cx = L + gw*i + gw/2, op = i === 5 ? 1 : .55;
    const bar = (v, xx, col) => { const h = y(0) - y(v); return h > 0 ? `<rect x="${xx}" y="${y(v)}" width="${bw}" height="${h}" rx="${Math.min(3,h/2)}" fill="var(${col})" opacity="${op}"/>` : ''; };
    g += bar(x.e, cx - bw - 1.5, '--pos') + bar(x.s, cx + 1.5, '--h-orange') + `<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="10.5" fill="${i===5?'var(--ink)':'var(--muted)'}">${cap(MES[+months[i].slice(5)-1])}</text>`; });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pontos que entraram e saíram por mês">${g}</svg></div><div class="actions" style="gap:16px;margin-top:6px"><span class="legend"><i style="background:var(--pos)"></i>Entraram</span><span class="legend"><i style="background:var(--h-orange)"></i>Saíram</span></div>`;
}

function formTransfer(pre){

  const fields = [
    {k:'de', label:'De', type:'select', options:opts, def:pre.de}, {k:'para', label:'Para', type:'select', options:opts, def:pre.para || opts[1][0]},
    {k:'qtd', label:'Pontos enviados', type:'number'}, {k:'bonus', label:'Bônus da promoção (%)', type:'number', def:pre.bonus ?? 0},
    {k:'paridade', label:'Paridade (pontos por milha)', type:'number', def:1, hint:'Livelo → Smiles normalmente 1:1'},
    {k:'data', label:'Data', type:'date', def:today()}, {k:'venc', label:'Milhas expiram em', type:'date'},
    {k:'cred', label:'Crédito previsto', type:'date', hint:'Deixe vazio se cai na hora'},
  ];
  let manual = pre.bonus !== undefined, lastPair = '';
  const calc = v => { const st = progStats(v.de, v.data), rec = Math.round((+v.qtd||0)/(+v.paridade||1)*(1+(+v.bonus||0)/100)), custo = st.cpm * (+v.qtd||0)/1000; return {st, rec, custo, cpm: rec ? custo/(rec/1000) : 0}; };
  openSheet({title:'Transferir pontos', fields, saveLabel:'Transferir', extra:'<div id="tr-prev" class="callout" style="margin-top:10px">Informe a quantidade.</div>',
    onInput: v => {

      if (document.activeElement === bEl) manual = true;
      const camp = bestCamp(v.de, v.para, v.data || today());
      if (pair !== lastPair){ lastPair = pair; if (!manual && bEl){ bEl.value = camp ? camp.bonus : 0; v.bonus = +bEl.value; } }
      const el = $('#tr-prev'); if (!el) return;
      const r = calc(v), info = camp ? `<div style="margin-bottom:6px">${ic('sparkle')} Campanha ativa: <b>+${camp.bonus}%</b> até ${fmtD(campFim(camp))}${camp.notas ? ' · ' + esc(camp.notas) : ''}</div>` : '';
      el.innerHTML = info + (v.qtd > 0 ? `Você recebe <b>${int(r.rec)}</b> em ${esc(get(v.para)?.nome)}. Saldo em ${esc(get(v.de)?.nome)}: ${int(r.st.saldo)}.${r.cpm ? `<br>Custo do milheiro no destino: <b>${brl(r.cpm)}</b> (era ${brl(r.st.cpm)} na origem).` : ''}` : 'Informe a quantidade.');

      const r = calc(v);
      if (v.qtd > r.st.saldo) return `Saldo insuficiente em ${get(v.de).nome} (${int(r.st.saldo)}).`;
      const desc = `Transferência ${get(v.de).nome} → ${get(v.para).nome}${v.bonus?` (+${v.bonus}%)`:''}`;
      putMany([{id:uid('pm'), kind:'pmov', tipo:'transf_out', prog:v.de, qtd:-v.qtd, data:v.data, desc}, {id:uid('pm'), kind:'pmov', tipo:'transf_in', prog:v.para, qtd:r.rec, data:v.data, desc, venc:v.venc, cred:v.cred, custo:CALC.r2(r.custo)}]);
    }});
}

async function saveFile(name, data, type = 'application/json'){
  if (IN_CLAUDE && window.claude?.use){
    try { const dl = await window.claude.use('downloads'); if (dl){ await dl.save({filename:name, data}); return true; } }
    catch(e){ if (e?.code === 'declined') return false; toast('Arquivo não salvo'); return false; }
  }
  const blob = new Blob([data], {type});
  try {
    const file = new File([blob], name, {type});
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) && navigator.canShare?.({files:[file]})){ await navigator.share({files:[file], title:name}); return true; }
  } catch(e){ if (e?.name === 'AbortError') return false; }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return true;
}

}

function parseMoney(v){
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v ?? '').trim(); if (!s || !/\d/.test(s)) return null;
  let neg = false;
  s = s.replace(/[−–]/g, '-');
  if (/^\(.*\)$/.test(s)){ neg = true; s = s.slice(1, -1); }
  if (/\d\s?D$/i.test(s)){ neg = true; s = s.replace(/\s?D$/i, ''); } else if (/\d\s?C$/i.test(s)) s = s.replace(/\s?C$/i, '');
  if (/\d\s?-$/.test(s)){ neg = true; s = s.replace(/\s?-$/, ''); }
  s = s.replace(/R\$|US\$|U\$|USD|BRL|EUR|€|\$|\s|\+/gi, '');
  if (s.startsWith('-')){ neg = !neg; s = s.slice(1); }
  if (!/^[\d.,]+$/.test(s)) return null;
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc >= 0 && ld >= 0) s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (lc >= 0) s = (s.length - lc - 1 <= 2) ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (ld >= 0 && /^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s); if (!isFinite(n)) return null;
  return neg ? -n : n;
}

function parseDateAny(v, refYear){

  if (v instanceof Date){ if (isNaN(v)) return null; const d = new Date(v.getTime() + 12*3600*1000); return ok(d.getFullYear(), d.getMonth()+1, d.getDate()); }
  if (typeof v === 'number'){ if (v > 30000 && v < 60000){ const d = new Date(Math.round((v - 25569) * 86400000) + 12*3600*1000); return ok(d.getUTCFullYear(), d.getUTCMonth()+1, d.getUTCDate()); } return null; }
  const s = norm(String(v ?? '').trim()); if (!s) return null;
  let m;

  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})(?!\d)/))) return ok(refYear, m[2], m[1]);
  if ((m = s.match(/^(\d{1,2})\s*(?:de\s+)?(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-z]*\.?(?:\s*(?:de\s+)?(\d{4}|\d{2}(?!\d)))?/))) return ok(m[3] ? (m[3].length === 2 ? '20' + m[3] : m[3]) : refYear, MES3.indexOf(m[2]) + 1, m[1]);
  if ((m = s.match(/^(\d{4})(\d{2})(\d{2})$/))) return ok(m[1], m[2], m[3]);
  return null;
}

function csvDelim(text){

function csvRows(text, d){

  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === d){ row.push(cell); cell = ''; }

function lineSvg(vals, labels, o = {}){

  const every = Math.max(1, Math.ceil(n / 7));
  labels.forEach((l, i) => { if (i % every === 0 || (i === n - 1 && (n - 1) % every >= every / 2)) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(l)}</text>`; });
  if (o.ref != null){ g += `<line x1="${L}" x2="${W}" y1="${y(o.ref)}" y2="${y(o.ref)}" stroke="var(--h-orange)" stroke-width="1.5" stroke-dasharray="5 4"/>` + (o.refLabel ? `<text x="${W - 2}" y="${y(o.ref) - 5}" text-anchor="end" font-size="10" font-weight="600" fill="var(--h-orange)">${esc(o.refLabel)}</text>` : ''); }
  if (o.marker != null){ const mx = x(o.marker); g += `<line x1="${mx}" x2="${mx}" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="2 3"/>` + (o.markerLabel ? `<text x="${mx - 4}" y="${H - B - 6}" text-anchor="end" font-size="10" fill="var(--muted)">${esc(o.markerLabel)}</text>` : ''); }
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  const col = o.color || 'var(--accent)';
  g += `<path d="M${x(0)},${y(Math.max(yMin, 0))} L${pts.join(' L')} L${x(n - 1)},${y(Math.max(yMin, 0))} Z" fill="${col}" opacity=".12"/>`;
  g += `<polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  if (n <= 26) vals.forEach((v, i) => { g += `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${v < 0 ? 'var(--neg)' : col}" stroke="var(--card)" stroke-width="1.5"/>`; });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || '')}">${g}</svg></div>`;
}
function barSvg(series, labels, o = {}){
  const W = 340, H = o.h || 170, L = 40, B = 22, T = 8, n = labels.length, k = series.length;
  const max = Math.max(1, ...series.flatMap(s => s.vals)), st = niceStep(max, 3), top = Math.ceil(max / st) * st;
  const y = v => T + (H - T - B) * (1 - Math.max(0, v) / top), gw = (W - L) / n, bw = Math.min(14, gw * (k > 1 ? .3 : .55));
  let g = '';
  for (let v = 0; v <= top + 1e-9; v += st){ const yy = y(v); g += `<line x1="${L}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)" ${v ? 'stroke-dasharray="3 4"' : ''}/><text x="${L - 6}" y="${yy + 3.5}" text-anchor="end" font-size="9.5" fill="var(--muted)">${v ? shortV(v) : '0'}</text>`; }
  const every = Math.max(1, Math.ceil(n / 12));
  labels.forEach((l, i) => {

  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || '')}">${g}</svg></div>`;
}

/* ---------- 2. Fluxo de caixa futuro ---------- */
const FLX = {h:6, out:true, inn:true, trips:true};
function flowAvgs(){
  const cur = ym(today()), ms = [1, 2, 3].map(i => mAdd(cur, -i)); let out = 0, inn = 0;
  for (const t of TX()){ if (t.parc || !ms.includes(ym(t.data))) continue; if (t.tipo === 'saida') out += +t.valor; else if (t.tipo === 'entrada'){ if (t.cartao) out -= +t.valor; else inn += +t.valor; } }
  return {out: Math.max(0, out / 3), inn: inn / 3};
}
function flowProj(h = FLX.h, extra = []){
  const t = today(), cur = ym(t), txs = extra.length ? [...TX(), ...extra] : TX(), A = flowAvgs();
  const fats = all('cartao').flatMap(c => FIN.faturasDoCartao(c, txs).filter(f => f.pend > 0));
  const divs = all('divida').filter(d => d.status !== 'quitada' && +d.parcela > 0);
  const trips = all('trip').filter(tr => tr.status !== 'concluida' && tr.ida && tr.ida >= t);
  const nd = daysInMonth(cur), frac0 = (nd - +t.slice(8)) / nd;
  let saldo = contasSaldo(); const rows = [];
  for (let i = 0; i < h; i++){
    const m = mAdd(cur, i), inM = d => i === 0 ? ym(d) <= m : ym(d) === m;
    let ent = 0, sai = 0, fat = 0, dv = 0, viag = 0;
    for (const x of txs){ if (x.pago || x.cartao || !inM(x.data)) continue; if (x.tipo === 'entrada' || x.invMov === 'resgate') ent += +x.valor; else if (x.tipo === 'saida' || x.invMov === 'aporte') sai += +x.valor; }
    for (const f of fats) if (inM(f.due)) fat += f.pend;
    for (const d of divs){ const k = monthsBetween(d.proxVenc ? ym(d.proxVenc) : cur, m); if (k >= 0 && (!+d.restantes || k < +d.restantes) && !(i === 0 && d.proxVenc && d.proxVenc < t)) dv += +d.parcela; }
    if (FLX.trips) for (const tr of trips) if (ym(tr.ida) === m){ const T = tripTotals(tr); viag += Math.max(0, (T.orc || T.previsto) - T.gasto); }
    const f = i === 0 ? frac0 : 1, vo = FLX.out ? A.out * f : 0, vi = FLX.inn ? Math.max(0, A.inn * f - ent) : 0;
    const entT = ent + vi, saiT = sai + fat + dv + viag + vo; saldo += entT - saiT;
    rows.push({m, ent, vi, sai, fat, dv, viag, vo, entT, saiT, saldo});
  }
  return {rows, A, ini:contasSaldo()};
}

/* ---------- 3. Parcelas ativas ---------- */
function parcGroups(){
  const t = today(), map = new Map(), txs = TX(), fcache = {};

  for (const x of txs){
    if (x.tipo !== 'saida' || !isParc(x)) continue;
    const n = +x.parc.split('/')[1], base = norm(x.desc).replace(/\s*(parcela)?\s*\d+\s*(de|\/)\s*\d+\s*$/, '').trim();
    const key = x.grupo || [base, x.cartao || x.conta, n, Math.round(+x.valor)].join('|');
    if (!map.has(key)) map.set(key, []); map.get(key).push(x);
  }
  const out = [];

    xs.sort((a, b) => +a.parc.split('/')[0] - +b.parc.split('/')[0]);
    const last = xs[xs.length - 1], n = +last.parc.split('/')[1], li = +last.parc.split('/')[0], fi = +xs[0].parc.split('/')[0], card = last.cartao ? get(last.cartao) : null;

function scoreCalc(){

  const e = ms.reduce((s, x) => s + x.e, 0), s3 = ms.reduce((s, x) => s + x.s, 0), desp = s3 / 3, P = patrimonio();

  parts.push({k:'poup', nome:'Quanto você poupa', icon:'coins', hue:'green', pts: sr == null ? 0 : 20 * clamp01(sr / .2), info: sr == null ? 'sem receitas nos últimos 3 meses' : `${pct(Math.round(sr * 1000) / 10)} da renda (média de 3 meses)`, dica: sr == null ? 'Lance suas receitas para medir quanto sobra.' : sr < .2 ? `Guardar 20% da renda (≈ ${brl0(e / 3 * .2)}/mês) dá a nota máxima. Hoje sobram ${brl0((e - s3) / 3)}/mês.` : 'Ótimo: você poupa 20% ou mais da renda.'});
  const liq = P.contas + P.inv, meses = desp ? liq / desp : (liq > 0 ? 12 : 0);

  const lim = all('cartao').filter(c => c.ativo !== false).reduce((s, c) => s + (+c.limite || 0), 0), uso = lim ? P.faturas / lim : 0;
  parts.push({k:'card', nome:'Uso do limite dos cartões', icon:'card', hue:'indigo', pts: !lim ? 20 : 20 * clamp01((.9 - uso) / .6), info: lim ? `${Math.round(uso * 100)}% do limite em uso` : 'nenhum cartão cadastrado', dica: uso > .3 ? 'Manter o uso abaixo de 30% do limite melhora a nota (e o score de crédito nos bancos).' : 'Uso do limite saudável.'});
  const buds = all('bud'), pm = mAdd(cur, -1), sp = catSpend(pm), okB = buds.filter(b => (sp[b.cat] || 0) <= +b.limite).length;
  parts.push({k:'orc', nome:'Orçamento respeitado', icon:'target', hue:'orange', pts: buds.length ? 20 * okB / buds.length : 8, info: buds.length ? `${okB} de ${buds.length} limites cumpridos em ${MES[+pm.slice(5) - 1]}` : 'sem limites por categoria', dica: !buds.length ? 'Defina limites por categoria em Dinheiro › Orçamento.' : okB < buds.length ? `Estouraram: ${buds.filter(b => (sp[b.cat] || 0) > +b.limite).map(b => b.cat).join(', ')}.` : 'Todos os limites cumpridos.'});
  const late = TX().filter(x => !x.pago && !x.cartao && x.tipo === 'saida' && x.data < t).length + all('cartao').reduce((s, c) => s + FIN.faturasDoCartao(c, TX()).filter(f => f.pend > 0 && f.due < t).length, 0);
  parts.push({k:'dia', nome:'Contas em dia', icon:'check', hue:'teal', pts:Math.max(0, 20 - 7 * late), info: late ? `${late} conta(s) ou fatura(s) atrasada(s)` : 'nada atrasado', dica: late ? 'Pague ou marque como pagas as contas atrasadas em Dinheiro › A pagar.' : 'Nenhum atraso.'});

}

async function parseBankFile(file){
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (ext === 'pdf') return parsePdf(await pdfLines(file));
  if (['xls', 'xlsx', 'ods'].includes(ext)){
    await loadLib('xlsx'); const wb = XLSX.read(new Uint8Array(await file.arrayBuffer()), {type:'array', cellDates:true}); let res = {rows:[]};
    for (const name of wb.SheetNames){ const r = parseTable(XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:''})); if (r.rows.length > res.rows.length || (!res.rows.length && r.erro)) res = r; }
    return res;
  }
  const text = await fileText(file);
  return /<OFX>|OFXHEADER|<STMTTRN>/i.test(text) ? parseOFX(text) : parseTable(csvRows(text, csvDelim(text)));
}
async function concRun(file){
  if (!file) return; const dest = UI.conc, isCard = dest.startsWith('k:'), did = dest.slice(2);
  toast('Lendo o extrato…');
  let res; try { res = await parseBankFile(file); } catch(e){ toast('Não consegui ler este arquivo'); return; }
  if (!res.rows.length){ toast(res.erro || 'Não encontrei lançamentos no arquivo'); return; }
  const rows = res.rows.map(r => ({...r, data: r.data > addDays(today(), 31) ? (+r.data.slice(0, 4) - 1) + r.data.slice(4) : r.data}));
  const ds = rows.map(r => r.data).sort(), lo = addDays(ds[0], -3), hi = addDays(ds[ds.length - 1], 3);
  const app = TX().filter(t => (isCard ? t.cartao === did && t.tipo !== 'pagfatura' : (t.conta === did || t.contaDest === did)) && t.data >= lo && t.data <= hi);
  const used = new Set(), match = [], onlyBank = [];
  for (const r of rows){
    const abs = CALC.r2(Math.abs(r.valor));
    const cand = app.filter(t => !used.has(t.id) && ((r.fitid && t.fitid === r.fitid) || (Math.abs(+t.valor - abs) < 0.011 && Math.abs(CALC.days(t.data, r.data)) <= 3))).sort((a, b) => (b.fitid === r.fitid) - (a.fitid === r.fitid) || Math.abs(CALC.days(a.data, r.data)) - Math.abs(CALC.days(b.data, r.data)))[0];
    if (cand){ used.add(cand.id); match.push({r, t:cand}); } else onlyBank.push(r);

  UI.month = ym(hi2); render();
}

const TCAT_HUE = {'Passagem':'--h-teal','Hospedagem':'--h-indigo','Cruzeiro':'--h-blue','Alimentação':'--h-orange','Transporte local':'--h-purple','Passeios':'--h-pink','Seguro viagem':'--h-green','Compras':'--h-red','Documentos':'--h-gray','Outros':'--h-yellow'};
function tripCompare(){
  return all('trip').map(tr => {

function tripAcertoCalc(tr){
  const ppl = tripPeople(tr); if (ppl.length < 2) return null;
  const T = tripTotals(tr), paid = Object.fromEntries(ppl.map(p => [p, 0])), share = Object.fromEntries(ppl.map(p => [p, 0])), sent = Object.fromEntries(ppl.map(p => [p, 0]));
  for (const c of T.conf){ const v = +c.valor || 0; if (!v) continue; const who = ppl.includes(c.pagoPor) ? c.pagoPor : ppl[0]; paid[who] += v; const part = c.rateio === 'pagador' ? [who] : ppl; part.forEach(p => share[p] += v / part.length); }
  const acs = tr.acertos || [];
  for (const a of acs){ if (a.de in sent) sent[a.de] += +a.valor; if (a.para in sent) sent[a.para] -= +a.valor; }
  const bal = ppl.map(p => ({p, paid:paid[p], share:share[p], b:CALC.r2(paid[p] - share[p] + sent[p])}));
  const deb = bal.filter(x => x.b < -0.009).map(x => ({...x})).sort((a, b) => a.b - b.b), cre = bal.filter(x => x.b > 0.009).map(x => ({...x})).sort((a, b) => b.b - a.b), moves = [];
  while (deb.length && cre.length){ const d = deb[0], c = cre[0], v = CALC.r2(Math.min(-d.b, c.b)); if (v > 0) moves.push({de:d.p, para:c.p, valor:v}); d.b += v; c.b -= v; if (d.b > -0.009) deb.shift(); if (c.b < 0.009) cre.shift(); }
  return {ppl, eu:ppl[0], bal, moves, acs, total:T.gasto};
}

  const meu = A.bal.find(x => x.p === A.eu);

  </div></div>`;

function docAlertList(t = today()){
  const out = [];

  for (const tr of all('trip').filter(x => x.status !== 'concluida' && x.ida && x.ida >= t)){
    for (const p of tripPeople(tr)){
      const pp = all('doc').find(d => d.tipo === 'Passaporte' && norm(d.pessoa) === norm(p));
      if (pp && pp.validade && pp.validade >= t && pp.validade < addMonths(tr.volta || tr.ida, 6)) out.push({d:CALC.days(t, tr.ida), t:`Passaporte de ${p}: menos de 6 meses de validade na volta de ${tr.destino}`, m:`vence ${fmtD(pp.validade)} · muitos países exigem 6 meses`, bad:true, id:pp.id});
    }

}

/* ---------- 6. Pontos automáticos dos cartões ---------- */
function autoPtsFor(newTxs){
  const out = [], txs = [...TX(), ...newTxs];
  for (const p of newTxs.filter(x => x.tipo === 'pagfatura')){
    const card = get(p.cartao); if (!card || !card.ptsProg || !(+card.ptsTaxa > 0) || !get(card.ptsProg)) continue;
    const key = p.fatura, tag = card.id + '|' + key;
    if (all('pmov').some(m => m.fatAuto === tag) || out.some(m => m.fatAuto === tag)) continue;
    const f = FIN.fatura(card, key, txs); if (f.pend > 0.009 || f.total <= 0) continue;
    const base = card.ptsUnid === 'dolar' ? f.total / (+card.ptsCot || 5.5) : f.total, qtd = Math.floor(base * (+card.ptsTaxa));
    if (qtd <= 0) continue;
    const prog = get(card.ptsProg);
    out.push({id:uid('pm'), kind:'pmov', prog:card.ptsProg, tipo:'acumulo', qtd, data:p.data, cred: +card.ptsDias ? addDays(p.data, +card.ptsDias) : '', venc: prog?.validade ? addMonths(+card.ptsDias ? addDays(p.data, +card.ptsDias) : p.data, +prog.validade) : '', desc:`Fatura ${card.nome} ${monthShort(key)}`, custo:0, fatAuto:tag});
  }
  return out;
}

/* ---------- 8. Metas de milhas ---------- */
function mgoalCalc(g){
  const t = today(), p = get(g.prog); if (!p) return null;
  const st = progStats(p.id), pend = progPend(p.id).reduce((s, m) => s + (+m.qtd), 0);
  const meses = Math.max(1, g.prazo ? monthsBetween(ym(t), ym(g.prazo)) : 12);
  const since = addMonths(t, -6), acc = all('pmov').filter(m => m.prog === p.id && +m.qtd > 0 && m.data >= since && !['transf_in','ajuste_mais'].includes(movTipo(m))).reduce((s, m) => s + (+m.qtd), 0) / 6;
  const feeders = all('prog').filter(x => x.id !== p.id && x.tipo === 'pontos').map(x => { const best = all('camp').filter(c => c.de === x.id && c.para === p.id).reduce((b, c) => Math.max(b, +c.bonus || 0), 0); return {p:x, saldo:progStats(x.id).saldo, bonus:best}; }).filter(x => x.saldo > 0);
  const feedTot = feeders.reduce((s, x) => s + x.saldo * (1 + x.bonus / 100), 0);
  const tem = st.saldo + pend, falta = Math.max(0, (+g.alvo || 0) - tem), proj = tem + acc * meses;
  const faltaDepois = Math.max(0, (+g.alvo || 0) - proj - feedTot);
  const preco = +CALCS.b_preco || 35, bonusCompra = Math.max(0, ...feeders.map(x => x.bonus), 0);
  const custoCompra = faltaDepois / (1 + bonusCompra / 100) / 1000 * preco;
  return {p, st, pend, tem, falta, meses, acc, proj, feeders, feedTot, faltaDepois, custoCompra, preco, bonusCompra, pct: g.alvo ? Math.min(1, tem / g.alvo) : 0, porMes: falta / meses};
}

const splitNames = s => String(s || '').split(/[,;\n]+/).map(x => x.trim()).filter(Boolean);

function milCpf(){

  if (!progs.length) return `<section class="card">${emptyBox('users','indigo','Cadastre seus programas de milhas para controlar os beneficiários.')}</section>`;
  return `<div class="actions"><button class="btn pri sm" data-act="add-benef">${ic('plus')}Beneficiário</button></div><div class="days">` + progs.map(p => {
    const win = p.cpfJanela === '12m' ? addMonths(t, -12) : t.slice(0, 4) + '-01-01', its = L.filter(x => x.prog === p.id && x.data >= win);
    const by = {}; its.forEach(x => { const k = norm(x.nome); if (!by[k] || by[k].data < x.data) by[k] = x; });

/* ---------- 11. Categorização que aprende ---------- */
function ruleKey(desc){
  const w = norm(cleanDesc(desc)).replace(/[^a-z ]/g, ' ').split(/\s+/).filter(x => x.length >= 3 && !STOPW.has(x) && !['parcela','compra','pagamento','pix','ltda','com','br','sao','paulo'].includes(x));
  return w.slice(0, 2).join(' ');
}
function ruleFor(desc, tipo){
  const d = ' ' + norm(desc).replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ') + ' ';
  return all('rule').filter(r => r.tipo === tipo && r.pat && d.includes(' ' + r.pat + ' ')).sort((a, b) => b.pat.length - a.pat.length)[0] || null;
}
function learnRule(desc, cat, tipo){
  if (!desc || !cat || !['entrada','saida'].includes(tipo)) return null;
  const pat = ruleKey(desc); if (!pat) return null;
  const id = 'rule_' + tipo[0] + '_' + pat.replace(/ /g, '_'), cur = get(id);
  if (cur && cur.cat === cat) return null;

}

/* ---------- 12. Radar de assinaturas ---------- */
const subKey = d => norm(cleanDesc(d)).replace(/\d+/g, ' ').replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ').trim().split(' ').filter(w => w.length >= 2).slice(0, 3).join(' ');
function assinaturas(){
  const t = today(), since = addMonths(t, -13), g = {};
  for (const x of TX()){ if (x.tipo !== 'saida' || x.rec || isParc(x) || x.data < since || x.data > t || !x.desc) continue; const k = subKey(x.desc); if (!k) continue; (g[k] = g[k] || []).push(x); }
  const out = [];
  for (const [k, xs] of Object.entries(g)){
    xs.sort((a, b) => a.data < b.data ? -1 : 1);
    const months = [...new Set(xs.map(x => ym(x.data)))], recent = months.filter(m => m >= ym(addMonths(t, -6)));
    const isSub = xs.some(x => x.cat === 'Assinaturas') || /netflix|spotify|apple|icloud|google|youtube|prime|disney|hbo|max|deezer|chatgpt|openai|claude|microsoft|adobe|globoplay|paramount|academia|smartfit|clube/.test(k);
    if (!(recent.length >= 3 || (isSub && months.length >= 2)) || xs.length > months.length * 2) continue;
    const vals = xs.map(x => +x.valor), last = xs[xs.length - 1], prev = xs.slice(0, -1).reverse().find(x => Math.abs(+x.valor - +last.valor) > 0.009);
    const mean = vals.reduce((a, b) => a + b, 0) / vals.length, sd = Math.sqrt(vals.reduce((s, v) => s + (v - mean) ** 2, 0) / vals.length);
    if (!isSub && (sd / mean > .25 || ['Mercado','Restaurantes','Alimentação','Transporte','Compras pessoais','Lazer','Viagem','Presentes'].includes(last.cat))) continue;
    const ativa = CALC.days(last.data, t) <= 45, nova = CALC.days(xs[0].data, t) <= 70;
    const aumento = prev && +last.valor > +prev.valor ? (+last.valor - +prev.valor) / +prev.valor : 0;
    out.push({k, nome:cleanDesc(last.desc), cat:last.cat, valor:+last.valor, ano:+last.valor * 12, ultima:last.data, meses:months.length, ativa, nova, aumento, antes:prev ? +prev.valor : null, onde:ondeLabel(last), id:last.id});
  }
  return out.sort((a, b) => b.ano - a.ano);
}
function dinAssin(){
  const as = assinaturas(), at = as.filter(a => a.ativa), par = as.filter(a => !a.ativa), mes = at.reduce((s, a) => s + a.valor, 0), up = at.filter(a => a.aumento > .02);
  if (!as.length) return recSection() + `<section class="card">${emptyBox('repeat','purple','Nenhuma outra cobrança recorrente encontrada. Com 2 ou 3 meses de lançamentos (ou extratos importados), a Caderneta detecta assinaturas, contas fixas e aumentos de preço sozinha.')}</section>`;
  return recSection() + `<div class="stats3"><div class="card stat"><span class="label">Detectadas por mês</span><b>${brl0(mes)}</b><small>${at.length} recorrente(s)</small></div><div class="card stat"><span class="label">Por ano</span><b>${brl0(mes * 12)}</b></div><div class="card stat"><span class="label">Aumentaram</span><b class="${up.length ? 'neg' : ''}">${up.length}</b><small>últimos 13 meses</small></div></div>

    <section class="card"><div class="card-head"><h3>Detectadas nos lançamentos</h3><span class="label">ainda não são fixos</span></div><div class="list">${at.map(a => `<div class="item"><div class="main" role="button" tabindex="0" data-edit="tx" data-id="${a.id}">${''}<div class="t">${esc(a.nome)}${a.nova ? '<span class="chip warn">nova</span>' : ''}${a.aumento > .02 ? `<span class="chip bad">+${Math.round(a.aumento * 100)}%</span>` : ''}</div><div class="m">${esc(a.cat)} · ${esc(a.onde)} · última ${fmtD(a.ultima)} · ${a.meses} meses · ${brl0(a.ano)}/ano</div></div><div class="amt"><div>${brl(a.valor)}</div><button class="btn sm" style="margin-top:6px" data-mkrec="${a.id}">Tornar fixo</button></div></div>`).join('')}</div></section>
    ${par.length ? `<section class="card"><div class="card-head"><h3>Pararam de cobrar?</h3><span class="label">sem cobrança há mais de 45 dias</span></div><div class="list">${par.map(a => `<div class="item"><div class="main"><div class="t">${esc(a.nome)}</div><div class="m">última ${fmtD(a.ultima)}</div></div><div class="amt">${brl(a.valor)}</div></div>`).join('')}</div></section>` : ''}
    <p class="foot" style="margin:0">Detectado pelos lançamentos que se repetem todo mês com valor parecido. Cancelar o que não usa é o jeito mais rápido de subir a taxa de poupança.</p>`;

/* ---------- 13. Carteira de investimentos ---------- */
const CLS = {ext:['Exterior (dólar/euro)','--h-pink'], pos:['Pós-fixado (CDI/Selic)','--h-green'], infl:['Inflação (IPCA+)','--h-indigo'], pre:['Prefixado','--h-blue'], rv:['Renda variável','--h-purple'], prev:['Previdência','--h-teal'], cripto:['Cripto','--h-orange']};
const invClass = i => i.moeda && i.moeda !== 'BRL' ? 'ext' : i.tipo === 'Cripto' ? 'cripto' : i.tipo === 'Previdência' ? 'prev' : i.idx === 'ipca' ? 'infl' : i.idx === 'pre' ? 'pre' : ['cdi','selic','poup'].includes(i.idx) ? 'pos' : 'rv';
const PERFIS = {conservador:['Conservador', {ext:5, pos:65, infl:20, pre:10, rv:0, prev:0, cripto:0}], moderado:['Moderado', {ext:10, pos:45, infl:25, pre:10, rv:10, prev:0, cripto:0}], arrojado:['Arrojado', {ext:20, pos:25, infl:20, pre:5, rv:25, prev:0, cripto:5}]};
function invYield(i, s){ const t = (+i.taxa || 0), cdi = +s.cdi || 0, ip = +s.ipca || 0; return i.idx === 'cdi' ? cdi * t / 100 : i.idx === 'selic' ? cdi + t : i.idx === 'pre' ? t : i.idx === 'ipca' ? ((1 + ip / 100) * (1 + t / 100) - 1) * 100 : i.idx === 'poup' ? (cdi > 8.5 ? 6.17 : cdi * .7) : null; }
let CART_AP = 1000;
function patCart(){
  const s = settings(), t = today(), invs = invAtivos().map(i => ({i, v:CALC.evaluate(i, s, t).liq, c:invClass(i), y:invYield(i, s)})), tot = invs.reduce((a, x) => a + x.v, 0);
  const alvo = s.aloc || PERFIS[s.perfil || 'moderado'][1], by = {}; invs.forEach(x => by[x.c] = (by[x.c] || 0) + x.v);
  const yk = invs.filter(x => x.y != null), wy = yk.reduce((a, x) => a + x.v, 0) ? yk.reduce((a, x) => a + x.y * x.v, 0) / yk.reduce((a, x) => a + x.v, 0) : 0;
  const ap = +CART_AP || 0, novoTot = tot + ap, gaps = Object.keys(CLS).map(k => ({k, gap: Math.max(0, novoTot * (alvo[k] || 0) / 100 - (by[k] || 0))})), gsum = gaps.reduce((a, x) => a + x.gap, 0);

const PIN_KEY = 'caderneta.pin', PIN_ITER = 400000;
const pinDoc = () => { try { return JSON.parse(lsGet(PIN_KEY) || 'null'); } catch(e){ return null; } };
async function pinKey(pin, salt, iter){ const base = await crypto.subtle.importKey('raw', new TextEncoder().encode('pin\n' + pin), 'PBKDF2', false, ['deriveKey']); return crypto.subtle.deriveKey({name:'PBKDF2', salt:CRYPTO.unb64(salt), iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']); }
async function setPin(pin){ if (!S.dkRaw) throw new Error('nokey'); const salt = CRYPTO.newSalt(), k = await pinKey(pin, salt, PIN_ITER), wrap = await CRYPTO.enc(k, {dk:CRYPTO.b64(S.dkRaw), lock:lockDoc()?.salt || ''}); lsSet(PIN_KEY, JSON.stringify({salt, iter:PIN_ITER, wrap, fails:0, user:lsGet('caderneta.user') || ''})); }
async function unlockPin(pin){
  const P = pinDoc(); if (!P) return 'none';
  try { const k = await pinKey(pin, P.salt, P.iter), w = await CRYPTO.dec(k, P.wrap); S.dkRaw = CRYPTO.unb64(w.dk); S.key = await importDK(S.dkRaw); await openAll(); if (S.bad && !S.items.size){ lsSet(PIN_KEY, null); lockNow(); return 'wiped'; } lsSet(PIN_KEY, JSON.stringify({...P, fails:0})); return 'ok'; }
  catch(e){ const f = (P.fails || 0) + 1; if (f >= 5){ lsSet(PIN_KEY, null); return 'wiped'; } lsSet(PIN_KEY, JSON.stringify({...P, fails:f})); return 5 - f; }
}

      <div class="err" id="pin-err"></div><button class="btn pri" type="submit">${ic('lock')}Entrar</button></form>

async function onPinSubmit(e){

  if (!/^\d{6}$/.test(pin)) return err.textContent = 'O PIN tem 6 dígitos.';

/* ---------- 3. Fluxo diário ---------- */
function dailyProj(n = 31){
  const t = today(), txs = TX(), A = flowAvgs(), out = [], fats = all('cartao').flatMap(c => FIN.faturasDoCartao(c, txs).filter(f => f.pend > 0));
  let saldo = contasSaldo();
  for (let i = 0; i < n; i++){
    const d = addDays(t, i), hit = x => i === 0 ? x <= d : x === d; let mov = 0; const ev = [];
    for (const x of txs){ if (x.pago || x.cartao || !hit(x.data)) continue; if (x.tipo === 'entrada' || x.invMov === 'resgate'){ mov += +x.valor; ev.push('+' + (x.desc || x.cat)); } else if (x.tipo === 'saida' || x.invMov === 'aporte'){ mov -= +x.valor; ev.push('−' + (x.desc || x.cat)); } }
    for (const f of fats) if (hit(f.due)){ mov -= f.pend; ev.push('fatura'); }
    for (const dv of all('divida')) if (dv.status !== 'quitada' && +dv.parcela && dv.proxVenc && hit(dv.proxVenc)){ mov -= +dv.parcela; ev.push(dv.desc); }
    if (FLX.out) mov -= A.out / 30;
    saldo += mov; out.push({d, saldo, ev});
  }
  return out;
}
function dailyCard(){
  const ds = dailyProj(), min = ds.reduce((a, x) => x.saldo < a.saldo ? x : a, ds[0]);
  return `<section class="card"><div class="card-head"><h3>Próximos 30 dias, dia a dia</h3><span class="label">estimativa</span></div>
    ${lineSvg(ds.map(x => x.saldo), ds.map(x => String(+x.d.slice(8))), {aria:'Saldo previsto por dia', h:160})}
    <div class="callout" style="margin-top:8px">Dia mais apertado: <b>${dayLabel(min.d)}</b>, com saldo previsto de <b class="${min.saldo < 0 ? 'neg' : ''}">${brl(min.saldo)}</b>${min.saldo < 0 ? '. Antecipe uma receita ou mude a data de algum pagamento.' : '.'}</div></section>`;
}

let SNAP_DAY = '';
async function snapNow(){
  if (!S.key) return; SNAP_DAY = today();
  const P = patrimonio(), id = 'snap_' + ym(today()), cur = get(id), r = v => Math.round(v);
  const nv = {contas:r(P.contas), inv:r(P.inv), faturas:r(P.faturas), dividas:r(P.dividas), liquido:r(P.liquido), pts:r(P.pts)};
  if (cur && Object.keys(nv).every(k => cur[k] === nv[k])) return;
  if (![...S.items.values()].some(i => ['tx','inv','conta'].includes(i.kind))) return;
  await put({id, kind:'snap', m:ym(today()), ...nv});
}
function evolSeries(n = 12){
  const s = settings(), txs = TX(), out = [], cur = ym(today());
  for (let i = n - 1; i >= 0; i--){
    const m = mAdd(cur, -i), snap = get('snap_' + m);
    if (snap){ out.push({m, ...snap, est:false}); continue; }
    const fim = i === 0 ? today() : `${m}-${String(daysInMonth(m)).padStart(2, '0')}`;
    const cs = all('conta').filter(c => !c.dataIni || c.dataIni <= fim), contas = cs.reduce((a, c) => a + FIN.contaSaldo(c, txs.filter(t => t.data <= fim)), 0);
    const inv = all('inv').filter(x => x.inicio && x.inicio <= fim && !(x.encerrado && (x.encData || '') <= fim)).reduce((a, x) => a + CALC.evaluate(x, s, fim).liq, 0);
    if (!cs.length || cs.length < all('conta').filter(c => c.ativo !== false).length){ out.push({m, liquido:null}); continue; }
    let faturas = 0;
    for (const c of all('cartao')) for (const f of FIN.faturasDoCartao(c, txs)){ if (f.due <= fim) continue; let tot = 0; for (const x of txs){ if (x.cartao !== c.id || x.fatura !== f.key || x.data > fim) continue; if (x.tipo === 'saida') tot += +x.valor; else if (x.tipo === 'entrada') tot -= +x.valor; else if (x.tipo === 'pagfatura') tot -= +x.valor; } faturas += Math.max(0, tot); }
    const dividas = all('divida').filter(d => d.status !== 'quitada').reduce((a, d) => a + (+d.saldo || 0), 0);
    out.push({m, contas, inv, faturas, dividas, liquido:contas + inv - faturas - dividas, est:true});
  }
  return out;
}

/* ---------- 8. Diversificação ---------- */
function divers(){
  const s = settings(), t = today(), g = {inst:{}, pais:{}, moeda:{}}; let total = 0;
  const add = (inst, pais, moeda, v) => { if (!(v > 0)) return; total += v; g.inst[inst] = (g.inst[inst] || 0) + v; g.pais[pais] = (g.pais[pais] || 0) + v; g.moeda[moeda] = (g.moeda[moeda] || 0) + v; };
  for (const c of all('conta').filter(c => c.ativo !== false)) add(c.inst || c.nome, 'Brasil', 'BRL', FIN.contaSaldo(c, TX()));
  for (const i of invAtivos()) add(i.custodia || i.inst || 'Sem instituição', i.pais || (i.moeda && i.moeda !== 'BRL' ? 'Exterior' : 'Brasil'), i.moeda || 'BRL', CALC.evaluate(i, s, t).liq);
  const fgc = {}; for (const i of invAtivos().filter(i => FGC_TYPES.includes(i.tipo) && (!i.moeda || i.moeda === 'BRL'))) fgc[i.inst || '—'] = (fgc[i.inst || '—'] || 0) + CALC.evaluate(i, s, t).bruto;
  return {...g, total, fgc};
}
